<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="author" content="Giáp Chí Thanh" />
    <title>Khách hàng - Quản trị SmartBen</title>
    <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/all.min.css" />
    <link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../assets/css/site.css" />
    <link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body class="ad-body" data-goc="../" data-menu="khach-hang">
    <!-- Thanh bên + thanh trên được chèn bởi assets/js/admin.js -->
    <div id="adNoiDung">
        <div class="ad-head">
            <div><span class="sb-eyebrow">Khách hàng</span><h1>Danh sách khách hàng</h1><p id="demKhach"></p></div>
        </div>
        <section class="ad-panel">
            <form class="ad-filter-bar" id="formTimKhach" method="get" action="khach-hang.html">
                <input type="search" class="sb-control" name="tuKhoa" placeholder="Tên, email hoặc số điện thoại..." aria-label="Tìm khách hàng" />
                <select name="tinhTrang" class="sb-control" aria-label="Trạng thái">
                    <option value="">Tất cả trạng thái</option>
                    <option value="hoatdong">Đang hoạt động</option>
                    <option value="khoa">Bị khoá</option>
                </select>
                <select name="sapXep" class="sb-control" aria-label="Sắp xếp">
                    <option value="">Mới đăng ký</option>
                    <option value="chitieu">Chi tiêu nhiều nhất</option>
                    <option value="sodon">Nhiều đơn nhất</option>
                </select>
                <button type="submit" class="sb-btn sb-btn-grad"><i class="fas fa-search"></i> Tìm</button>
            </form>
            <div id="bangKhach"></div>
        </section>
    </div>

    <script src="../assets/js/jquery.min.js"></script>
    <script src="../assets/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/du-lieu-mau.js"></script>
    <script src="../assets/js/kho-du-lieu.js"></script>
    <script src="../assets/js/nghiep-vu.js"></script>
    <script src="../assets/js/giao-dien.js"></script>
    <script src="../assets/js/admin.js"></script>
    <script src="../assets/js/admin/khach-hang.js"></script>
</body>
</html>
