<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="author" content="Giáp Chí Thanh" />
    <title>Đánh giá - Quản trị SmartBen</title>
    <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/all.min.css" />
    <link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../assets/css/site.css" />
    <link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body class="ad-body" data-goc="../" data-menu="danh-gia">
    <!-- Thanh bên + thanh trên được chèn bởi assets/js/admin.js -->
    <div id="adNoiDung">
        <div class="ad-head">
            <div><span class="sb-eyebrow"><i class="fas fa-star"></i> Phản hồi</span><h1>Đánh giá sản phẩm</h1><p id="demDanhGia"></p></div>
        </div>
        <section class="ad-panel">
            <form class="ad-filter-bar" id="formLocDanhGia" method="get" action="danh-gia.html">
                <input type="search" class="sb-control" name="tuKhoa" placeholder="Tên khách, sản phẩm hoặc nội dung..." aria-label="Tìm đánh giá" />
                <select name="sao" class="sb-control" aria-label="Số sao">
                    <option value="">Mọi số sao</option><option value="5">5 sao</option><option value="4">4 sao</option><option value="3">3 sao</option><option value="2">2 sao</option><option value="1">1 sao</option>
                </select>
                <select name="hienThi" class="sb-control" aria-label="Trạng thái">
                    <option value="">Tất cả</option><option value="hien">Đang hiện</option><option value="an">Đang ẩn</option>
                </select>
                <button type="submit" class="sb-btn sb-btn-grad"><i class="fas fa-search"></i> Lọc</button>
            </form>
            <div id="bangDanhGia"></div>
        </section>
    </div>

    <script src="../assets/js/jquery.min.js"></script>
    <script src="../assets/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/du-lieu-mau.js"></script>
    <script src="../assets/js/kho-du-lieu.js"></script>
    <script src="../assets/js/nghiep-vu.js"></script>
    <script src="../assets/js/giao-dien.js"></script>
    <script src="../assets/js/admin.js"></script>
    <script src="../assets/js/admin/danh-gia.js"></script>
</body>
</html>
