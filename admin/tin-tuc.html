<body class="ad-body" data-goc="../" data-menu="tin-tuc">
    <!-- Thanh bên + thanh trên được chèn bởi assets/js/admin.js -->
    <div id="adNoiDung">
        <div class="ad-head">
            <div><span class="sb-eyebrow">Nội dung</span><h1>Quản lý tin tức</h1><p id="demTin"></p></div>
            <a class="sb-btn sb-btn-grad" href="tin-tuc-form.html"><i class="fas fa-plus"></i> Viết tin mới</a>
        </div>
        <section class="ad-panel">
            <form class="ad-filter-bar" id="formTimTin" method="get" action="tin-tuc.html">
                <input type="search" class="sb-control" name="tuKhoa" placeholder="Tìm theo tiêu đề hoặc tóm tắt..." aria-label="Tìm bài viết" />
                <select name="loc" class="sb-control" aria-label="Lọc trạng thái">
                    <option value="">Tất cả bài viết</option>
                    <option value="hien">Đang hiện</option>
                    <option value="an">Đang ẩn</option>
                </select>
                <button type="submit" class="sb-btn sb-btn-grad"><i class="fas fa-search"></i> Tìm</button>
            </form>
            <div id="bangTin"></div>
        </section>
    </div>
